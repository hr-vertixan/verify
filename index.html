<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Test</title>

<style>
body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

pre{
    background:#1f2937;
    padding:20px;
    margin-top:30px;
    border-radius:10px;
    text-align:left;
    overflow:auto;
}
</style>

</head>
<body>

<h1>Vertixan JSON Test</h1>

<button onclick="loadData()">Load data.json</button>

<pre id="output">Click the button...</pre>

<script>

async function loadData(){

    try{

        const response = await fetch("data.json");

        if(!response.ok){
            throw new Error("HTTP Error : " + response.status);
        }

        const data = await response.json();

        document.getElementById("output").textContent =
        JSON.stringify(data,null,4);

    }

    catch(err){

        document.getElementById("output").textContent =
        "ERROR : " + err;

    }

}

</script>

</body>
</html>
