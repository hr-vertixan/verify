<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vertixan Credential Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background: linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
overflow-x:hidden;
}

.container{
width:100%;
max-width:750px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:40px;
box-shadow: 0 15px 40px rgba(0,0,0,.45);
animation:fade .8s ease;
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
}

h1{
margin-top:20px;
text-align:center;
font-size:30px;
font-weight:700;
}

.subtitle{
text-align:center;
margin-top:8px;
color:#cbd5e1;
}

.badge{
width:160px;
margin:35px auto;
padding:14px;
border-radius:40px;
background:#16a34a;
text-align:center;
font-weight:700;
font-size:20px;
animation:pop .8s;
box-shadow:0 0 25px rgba(34,197,94,.45);
}

.card{
margin-top:25px;
background:rgba(255,255,255,.05);
border-radius:16px;
padding:25px;
}

.row{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.row:last-child{
border:none;
}

.label{
color:#94a3b8;
font-weight:500;
}

.value{
font-weight:600;
text-align:right;
}

.footer{
margin-top:35px;
text-align:center;
font-size:14px;
color:#94a3b8;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes pop{
0%{
transform:scale(.6);
opacity:0;
}
70%{
transform:scale(1.08);
}
100%{
transform:scale(1);
}
}

@media(max-width:650px){
.container{
padding:25px;
}

.row{
flex-direction:column;
gap:8px;
}

.value{
text-align:left;
}

h1{
font-size:24px;
}
}

</style>
</head>

<body>

<div class="container">

<div class="logo">V</div>

<h1>Vertixan</h1>

<div class="subtitle">
Official Credential Verification Portal
</div>

<div id="result">

<div class="badge">
✓ VERIFIED
</div>

<div class="card">

<div class="row">
<div class="label">Certificate ID</div>
<div class="value" id="certificate_id">Loading...</div>
</div>

<div class="row">
<div class="label">Intern ID</div>
<div class="value" id="intern_id">Loading...</div>
</div>

<div class="row">
<div class="label">Candidate Name</div>
<div class="value" id="name">Loading...</div>
</div>

<div class="row">
<div class="label">Status</div>
<div class="value" id="status">Verified</div>
</div>

</div>

<div class="footer">
© 2026 Vertixan • All Rights Reserved
</div>

</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const certificateId = params.get("id");

fetch("https://hr-vertixan.github.io/verify/data.json")
.then(response => response.json())
.then(data => {

const certificate = data.find(item => item.certificate_id === certificateId);

if(certificate){
document.getElementById("certificate_id").textContent = certificate.certificate_id;
document.getElementById("intern_id").textContent = certificate.intern_id;
document.getElementById("name").textContent = certificate.name;
document.getElementById("status").textContent = certificate.status;

}else{

document.getElementById("result").innerHTML = `
<div class="badge" style="background:#dc2626;box-shadow:0 0 25px rgba(220,38,38,.45);">
✕ INVALID
</div>

<div class="card">
<h2 style="text-align:center;margin-bottom:15px;">Certificate Not Found</h2>
<p style="text-align:center;color:#cbd5e1;line-height:1.8;">
The certificate ID you entered could not be verified.
Please check the QR Code or contact Vertixan for assistance.
</p>
</div>

<div class="footer">
© 2026 Vertixan • All Rights Reserved
</div>
`;

}

})
.catch(error => {

document.getElementById("result").innerHTML = `
<div class="badge" style="background:#f59e0b;">
ERROR
</div>

<div class="card">
<h2 style="text-align:center;margin-bottom:15px;">Unable to Load Verification Data</h2>
<p style="text-align:center;color:#cbd5e1;">Please try again later.</p>
</div>
`;

});
</script>

</body>
</html>
